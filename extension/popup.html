<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      body {
        width: 300px; margin: 0; padding: 18px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #050505; color: #F4F4F2;
        -webkit-font-smoothing: antialiased;
      }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
      .brand .word { font-size: 15px; letter-spacing: -0.02em; }
      .brand .word b { font-weight: 600; } .brand .word span { font-weight: 400; }
      .status {
        display: flex; align-items: center; gap: 9px; font-size: 13px; margin-bottom: 14px;
        border: 1px solid rgba(255,255,255,0.09); background: #0B0B0C; border-radius: 12px; padding: 10px 12px;
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
      .ok { background: #E9E9E5; } .off { background: #D96C64; }
      .muted { color: #A5A5A2; font-size: 13px; line-height: 1.55; }
      button {
        width: 100%; cursor: pointer; border: 0; border-radius: 10px; margin-top: 8px;
        background: #F2F2EF; color: #0A0A0A; font-weight: 560; font-size: 13px; padding: 10px;
        font-family: inherit; transition: transform .16s ease, opacity .16s ease;
      }
      button:hover { transform: translateY(-1px); }
      button.ghost {
        background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.11); color: #EAEAE7; font-weight: 500;
      }
      button.ghost:hover { background: rgba(255,255,255,0.06); transform: none; }
      .hint { margin-top: 13px; font-size: 12px; color: #93938F; line-height: 1.55; }
      code { color: #F4F4F2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
      @media (prefers-reduced-motion: reduce) { button:hover { transform: none; } }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <rect x="0.5" y="0.5" width="27" height="27" rx="8" fill="#101011" stroke="rgba(255,255,255,0.10)" />
        <g fill="#F4F4F2">
          <rect x="7" y="14" width="2.2" height="6" rx="1.1" opacity="0.55" />
          <rect x="10.4" y="11" width="2.2" height="12" rx="1.1" opacity="0.8" />
          <rect x="13.8" y="7.5" width="2.2" height="15" rx="1.1" />
          <rect x="17.2" y="10.5" width="2.2" height="9" rx="1.1" opacity="0.8" />
          <rect x="20.6" y="13" width="2.2" height="4.5" rx="1.1" opacity="0.55" />
        </g>
      </svg>
      <span class="word"><b>Note</b><span>Flow</span></span>
    </div>

    <div class="status"><span class="dot" id="dot"></span><span id="status-text">Checking…</span></div>

    <div class="muted">
      Open a Google Meet, Zoom, or Teams call and click <strong>Record</strong> on the NoteFlow
      widget — no link to paste. Captures appear in your meetings automatically.
    </div>

    <button id="open-app">Open My Meetings</button>
    <button class="ghost" id="sign-in">Sign in to NoteFlow</button>

    <p class="hint">
      Signed-in status is read from the NoteFlow app. If it says signed out, open the app and
      sign in once.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
